name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      agents:
        description: "Comma-separated agent list (e.g. security,bug_detection)"
        required: false
      max-lines:
        description: "Max changed lines before skipping"
        required: false
        default: "1500"
      fail-on:
        description: "Comma separated severities that fail the job (default critical,error)"
        required: false
      use-llm:
        description: "Enable LLM (true/false)"
        required: false
        default: "true"

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      FAIL_ON: ${{ inputs.fail-on || 'critical,error' }}
      ENABLE_LLM: ${{ inputs['use-llm'] || 'true' }}
      MAX_LINES: ${{ inputs['max-lines'] || '1500' }}
      AGENTS: ${{ inputs.agents || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        run: |
          if [ "${ENABLE_LLM}" != "false" ] && [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "GROQ_API_KEY not set but LLM enabled. Failing." >&2
            exit 1
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run review
        id: run
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -e
          EXTRA_ARGS=""
          if [ "${ENABLE_LLM}" = "false" ]; then EXTRA_ARGS="$EXTRA_ARGS --no-llm"; fi
          if [ -n "${AGENTS}" ]; then EXTRA_ARGS="$EXTRA_ARGS --agents ${AGENTS}"; fi
          python scripts/run_review.py \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --max-lines ${MAX_LINES} \
            --fail-on "${FAIL_ON}" \
            --output ../review.json \
            --verbose $EXTRA_ARGS || true

      - name: Parse
        id: parse
        run: |
          if [ ! -f review.json ]; then echo "status=Error" >> $GITHUB_OUTPUT; echo "summary=No output" >> $GITHUB_OUTPUT; echo "comments_count=0" >> $GITHUB_OUTPUT; echo "blocking=true" >> $GITHUB_OUTPUT; exit 0; fi
          python - <<'PY'
import json, os
with open('review.json') as f: data=json.load(f)
comments=data.get('comments',[])
from collections import Counter
sev=Counter(c.get('severity','info').lower() for c in comments)
fail_on={s.strip() for s in os.environ.get('FAIL_ON','critical,error').split(',') if s.strip()}
blocking=any(sev.get(s,0)>0 for s in fail_on)
with open(os.environ['GITHUB_OUTPUT'],'a') as o:
  o.write(f"status={data.get('final_status','Unknown')}\n")
  o.write(f"summary={data.get('summary','')}\n")
  o.write(f"comments_count={len(comments)}\n")
  o.write(f"blocking={'true' if blocking else 'false'}\n")
PY

      - name: PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data={};
            if (fs.existsSync('review.json')) data=JSON.parse(fs.readFileSync('review.json','utf8'));
            const status='${{ steps.parse.outputs.status }}';
            const summary='${{ steps.parse.outputs.summary }}';
            const total='${{ steps.parse.outputs.comments_count }}';
            const map={Approve:'✅', 'Needs Changes':'⚠️', Reject:'❌', Error:'💥'};
            let body=`## 🤖 AI Code Review\n\n**Status:** ${map[status]||'❓'} ${status}\n**Summary:** ${summary}\n**Issues:** ${total}\n`;
            if(data.comments){
              const buckets={};
              for (const c of data.comments){const s=(c.severity||'info').toLowerCase(); (buckets[s]=buckets[s]||[]).push(c);}  
              const order=['critical','error','high','warning','medium','low','info'];
              body+='\n### Breakdown\n';
              for(const s of order){ if(buckets[s]) body+=`- **${s.toUpperCase()}**: ${buckets[s].length}\n`; }
              body+='\n### Sample\n';
              for(const s of order){ (buckets[s]||[]).slice(0,2).forEach(i=>{ body+=`- ${i.file||'?'}:${i.line||'?'} ${i.severity?.toUpperCase()} - ${i.message}\n`; }); }
            }
            body+=`\n<details><summary>Raw JSON</summary>\n\n\`\`\`json\n${JSON.stringify(data,null,2)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body});

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.number || github.sha }}
          path: review.json
          retention-days: 14

      - name: Check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status='${{ steps.parse.outputs.status }}';
            const blocking='${{ steps.parse.outputs.blocking }}'==='true';
            let conclusion='success'; let title='AI Review: Approved';
            if(status==='Error'){ conclusion='failure'; title='AI Review Failed'; }
            else if(blocking){ conclusion='failure'; title='AI Review: Blocking'; }
            else if(status==='Needs Changes'){ conclusion='neutral'; title='AI Review: Needs Changes'; }
            await github.rest.checks.create({
              owner:context.repo.owner, repo:context.repo.repo,
              name:'AI Code Review', head_sha:context.payload.pull_request.head.sha,
              status:'completed', conclusion,
              output:{ title, summary:'${{ steps.parse.outputs.summary }}', text:'Issues: ${{ steps.parse.outputs.comments_count }}' }
            });

      - name: Fail on blocking
        if: steps.parse.outputs.blocking == 'true'
        run: echo "Blocking severities present -> failing" && exit 1