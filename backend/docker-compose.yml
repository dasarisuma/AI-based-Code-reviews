version: '3.8'

services:
  autopr-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CREW_AI_ENABLED=${CREW_AI_ENABLED:-false}
      - AUTO_PR_ENABLED_AGENTS=${AUTO_PR_ENABLED_AGENTS:-code_quality,bug_detection,security,dependency,documentation}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s